# This is a basic workflow to help you get started with Actions

name: Fetch Kubernetes Dynamic Secret

# Controls when the workflow will run
on:

  workflow_dispatch:

jobs:

  build:
    permissions: 
      id-token: write
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Fetch dynamic secrets from Akeyless
        id: fetch-secret
        uses: akeyless-community/akeyless-github-action@v1.1.2
        with:
          api-url: https://aws-gw.mg.cs.akeyless.fans
          access-id: p-y5bae7zhmim1om
          access-type: jwt        
          dynamic-secrets: |
            - name: "/4-dynamic-secret/kubernetes-dynamic-secret"
              output-name: "k8s-secret"
      - name: Use Akeyless secret
        run: |
            echo "Step Outputs"
            echo "Secret: ${{ steps.fetch-secret.outputs.k8s-secret }}"
      - name: Debug Secret from Akeyless
        run: |
          echo "$k8s-secret" | base64
